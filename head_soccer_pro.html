<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabezones Tecnica - </title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b132b;
            font-family: 'Press Start 2P', monospace;
            color: white;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: linear-gradient(to bottom, #1c2541 0%, #3a506b 100%);
            box-shadow: 0 0 30px rgba(72, 202, 228, 0.4);
            border: 4px solid #48cae4;
            border-radius: 10px;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(11, 19, 43, 0.95);
            z-index: 10;
        }
        .hidden { display: none !important; }
        
        .arcade-btn {
            background: linear-gradient(180deg, #f72585, #b5179e);
            color: white;
            padding: 15px 30px;
            margin: 10px;
            border: 4px solid #ff99c8;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #000;
            box-shadow: 0 6px 0 #7209b7, 0 10px 10px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .arcade-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #7209b7, 0 4px 4px rgba(0,0,0,0.5);
        }
        .arcade-btn.blue {
            background: linear-gradient(180deg, #48cae4, #0077b6);
            border-color: #caf0f8;
            box-shadow: 0 6px 0 #023e8a, 0 10px 10px rgba(0,0,0,0.5);
        }
        .arcade-btn.blue:active {
            box-shadow: 0 0 0 #023e8a, 0 4px 4px rgba(0,0,0,0.5);
        }

        #char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            width: 95%;
            max-width: 950px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #48cae4;
            border-radius: 10px;
        }
        .char-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .char-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        .char-color-preview {
            width: 40px;
            height: 40px;
            border-radius: 0;
            border: 3px solid #fff;
            margin: 0 auto 10px auto;
            box-shadow: inset -4px -4px 0 rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .char-name { font-size: 11px; line-height: 1.4; word-wrap: break-word; }

        #hud {
            position: absolute;
            top: 20px;
            width: 100%;
            max-width: 1850px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 30px;
            z-index: 5;
            pointer-events: none;
        }
        .score-panel {
            background: rgba(0,0,0,0.8);
            border: 3px solid;
            border-radius: 10px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 180px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .score-num { font-size: 40px; margin-top: 5px; text-shadow: 3px 3px 0 #000; }
        .player-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px;}
        
        #timer-box {
            background: rgba(0,0,0,0.8);
            border: 3px solid #f72585;
            border-radius: 10px;
            padding: 15px 25px;
            font-size: 24px;
            color: #fff;
            text-shadow: 2px 2px 0 #f72585;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #1c2541; border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: #48cae4; border-radius: 5px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud" class="hidden">
        <div class="score-panel" style="border-color: #48cae4;">
            <span id="p1-hud-name" class="player-name text-cyan-300">P1</span>
            <span id="p1-score" class="score-num text-white">0</span>
        </div>
        <div id="timer-box">02:30</div>
        <div class="score-panel" style="border-color: #f72585;">
            <span id="p2-hud-name" class="player-name text-pink-400">P2</span>
            <span id="p2-score" class="score-num text-white">0</span>
        </div>
    </div>

    <!-- Canvas de resolución ancha 1600x600 -->
    <canvas id="gameCanvas" width="1900" height="700"></canvas>

    <div id="ui-menu" class="ui-layer">
        <h1 class="text-3xl md:text-5xl text-yellow-300 mb-2 text-center" style="text-shadow: 4px 4px 0 #f72585;">CABEZONES CHAMPIONS</h1>
        <p class="text-sm md:text-base text-cyan-300 mb-10 text-center">EDICIÓN AMIGOS - DEFINITIVA</p>
        
        <div class="flex flex-col md:flex-row space-y-4 md:space-y-0 md:space-x-6">
            <button class="arcade-btn" onclick="startSelection('CPU')">1 VS CPU</button>
            <button class="arcade-btn blue" onclick="startSelection('PVP')">1 VS 1 LOCAL</button>
        </div>

        <div class="mt-8 bg-black/60 p-4 border-2 border-gray-600 rounded-lg text-xs text-gray-300 grid grid-cols-2 gap-8 text-center leading-relaxed">
            <div>
                <p class="text-cyan-400 mb-2">CONTROLES J1</p>
                <p>Mover: A / D</p>
                <p>Saltar: W</p>
                <p class="text-yellow-300 mt-1">Patear (mantené = SÚPER): ESPACIO</p>
            </div>
            <div>
                <p class="text-pink-400 mb-2">CONTROLES J2</p>
                <p>Mover: ◄ / ►</p>
                <p>Saltar: ▲</p>
                <p class="text-yellow-300 mt-1">Patear (mantené = SÚPER): M</p>
            </div>
        </div>
    </div>

    <div id="ui-select" class="ui-layer hidden">
        <h2 id="select-title" class="text-2xl md:text-3xl text-cyan-400 mb-6 text-center" style="text-shadow: 2px 2px 0 #000;">ELIGE JUGADOR 1</h2>
        <div id="char-grid"></div>
        <button class="arcade-btn mt-6 text-sm py-2 px-6" onclick="goToMenu()">VOLVER</button>
    </div>

    <div id="ui-gameover" class="ui-layer hidden">
        <h1 class="text-5xl text-yellow-300 mb-4 text-center" style="text-shadow: 4px 4px 0 #000;">¡FINAL DEL PARTIDO!</h1>
        <h2 id="winner-text" class="text-3xl text-white mb-6 text-center">GANA JUGADOR 1</h2>
        <p id="final-score" class="text-2xl text-cyan-300 mb-10">5 - 3</p>
        <button class="arcade-btn" onclick="goToMenu()">VOLVER AL MENÚ</button>
    </div>
</div>

<script>
    const ROSTER = [
        { id: 1, name: 'Juan "El Caniche" Prochetto', nickname: 'EL CANICHE', color: '#ff595e', skinColor: '#fcd5ce', hairColor: '#ffffff', style: 'curly', stripeColor: '#ffffff', badge: '🐩' },
        { id: 2, name: 'Agustín "El Ñandú" Gasparotti', nickname: 'EL ÑANDÚ', color: '#ffca3a', skinColor: '#e8b89e', hairColor: '#3a2e28', style: 'spiky', stripeColor: '#000000', badge: '🦩' },
        { id: 3, name: 'Bruno "El Dictador" Della Flora', nickname: 'EL DICTADOR', color: '#8ac926', skinColor: '#fcd5ce', hairColor: '#2b211e', style: 'beard', stripeColor: '#ffffff', badge: '🎖️' },
        { id: 4, name: 'Lolo "El Bobinado" Rivero', nickname: 'EL BOBINADO', color: '#1982c4', skinColor: '#c58c67', hairColor: '#111111', style: 'cap', stripeColor: '#ff0000', badge: '🧢' },
        { id: 5, name: 'Lauti "Gagá" Gabutti', nickname: 'GAGÁ', color: '#6a4c93', skinColor: '#fcd5ce', hairColor: '#8a624a', style: 'messy', stripeColor: '#ffd166', badge: '🤪' },
        { id: 6, name: 'Mateo "La Calesita" Donna', nickname: 'LA CALESITA', color: '#f15bb5', skinColor: '#e8b89e', hairColor: '#c08552', style: 'headband', stripeColor: '#00f5d4', badge: '🎠' },
        { id: 7, name: 'Pedro "El Sexoso" Capella', nickname: 'EL SEXOSO', color: '#00bbf9', skinColor: '#fcd5ce', hairColor: '#000000', style: 'slick', stripeColor: '#ff007f', badge: '🔥' },
        { id: 8, name: 'Tomás "El Electrónico" Bork', nickname: 'EL ELECTRÓNICO', color: '#00f5d4', skinColor: '#c58c67', hairColor: '#333333', style: 'visor', stripeColor: '#000000', badge: '⚡' },
        { id: 9, name: 'Bautista "La Babosa" Bessone', nickname: 'LA BABOSA', color: '#fee440', skinColor: '#fcd5ce', hairColor: '#5e4334', style: 'flat', stripeColor: '#7209b7', badge: '🐌' },
        { id: 10, name: 'Joaquín "El Paja" Franco', nickname: 'EL PAJA', color: '#9b5de5', skinColor: '#e8b89e', hairColor: '#7c5f4d', style: 'messy', stripeColor: '#ffffff', badge: '🦥' },
        { id: 11, name: 'Facundo "Floresrica" Porta', nickname: 'FLORESRICA', color: '#f1c0e8', skinColor: '#fcd5ce', hairColor: '#2b211e', style: 'flower', stripeColor: '#ff007f', badge: '🌸' },
        { id: 12, name: 'Pepa "El Matero" Ocampo', nickname: 'EL MATERO', color: '#ff99c8', skinColor: '#e8b89e', hairColor: '#000000', style: 'mate', stripeColor: '#3a5a40', badge: '🧉' },
        { id: 13, name: 'Vale "Gargamel" Ricca', nickname: 'GARGAMEL', color: '#a3c4f3', skinColor: '#c58c67', hairColor: '#ffffff', style: 'bald', stripeColor: '#1d3557', badge: '🧙' },
        { id: 14, name: 'Álvaro "Chupetín" López', nickname: 'CHUPETÍN', color: '#cfbaf0', skinColor: '#fcd5ce', hairColor: '#4f3b2f', style: 'lollipop', stripeColor: '#f72585', badge: '🍭' }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiMenu = document.getElementById('ui-menu');
    const uiSelect = document.getElementById('ui-select');
    const uiGameover = document.getElementById('ui-gameover');
    const uiHud = document.getElementById('hud');

    const CW = canvas.width, CH = canvas.height, GROUND_Y = 620;
    const GRAVITY = 0.6, FRICTION = 0.85;
    const PLAYER_RADIUS = 38, FOOT_SIZE = 20, BASE_JUMP_FORCE = 14.5, MOVE_SPEED = 6.5;
    const BALL_RADIUS = 22, BALL_BOUNCE = 0.78, MAX_BALL_SPEED = 46;
    const MAX_GOALS = 5, MATCH_DURATION = 150;
    const GOAL_W = 150, GOAL_H = 210, POST_RADIUS = 10;
    const SUPER_CHARGE = 70, MAX_CHARGE = 100, STEP = 1000 / 60;

    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const de = n => n.startsWith('EL ') ? 'DEL ' + n.slice(3) : 'DE ' + n;
    const al = n => n.startsWith('EL ') ? 'AL ' + n.slice(3) : 'A ' + n;

    const SUPERS = [
        { name: 'FUEGO', ang: 0.18, spd: 40, col: '#ff006e' },
        { name: 'COHETE', ang: 0.8, spd: 38, col: '#ffb703' },
        { name: 'CURVA', ang: 0.42, spd: 36, col: '#7209b7', curve: true }
    ];
    const PU_TYPES = {
        superJump: ['SALTO LOCO', 300], freeze: ['CONGELAR', 180], giantGoal: ['ARCO GIGANTE', 300],
        speedBoost: ['TURBO', 300], bigBall: ['PELOTÓN', 260], moon: ['GRAVEDAD LUNAR', 320]
    };

    const crowd = [];
    const crowdColors = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#fff', '#f15bb5', '#00bbf9'];
    for (let i = 0; i < 380; i++) crowd.push({ x: Math.random() * CW, y: 160 + Math.random() * (GROUND_Y - 380), color: pick(crowdColors), jumpSpeed: 0.003 + Math.random() * 0.008, size: 6 + Math.random() * 6 });

    let confetti = [];
    function spawnConfetti() {
        const cols = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93', '#f15bb5', '#00f5d4', '#ffffff'];
        confetti = Array.from({ length: 200 }, () => ({ x: CW / 2 + rnd(-60, 60), y: CH / 2 + rnd(-30, 30), vx: rnd(-9, 9), vy: rnd(-14, 2) - 4, size: rnd(6, 14), color: pick(cols), rot: rnd(0, 360), rs: rnd(-7, 7) }));
    }

    let gameState = 'MENU', currentMode = 'PVP', selectingPlayer = 1, p1Choice = null, p2Choice = null;
    let player1, player2, ball, activePowerup = null, lastTouch = null, prevTouch = null;
    let p1Score = 0, p2Score = 0, timeRemaining = MATCH_DURATION, tickFrames = 0, suddenDeath = false;
    let pauseFrames = 0, pendingEnd = false, goalInfo = ['', ''], banner = { text: '', timer: 0, color: '#fff' };
    let goalH = [GOAL_H, GOAL_H], goalTarget = [GOAL_H, GOAL_H], gravityMul = 1, barCooldown = 0, matchFrames = 0;
    let boxTimer = 600, lastBoxType = '';

    const keys = {};
    window.addEventListener('keydown', e => { keys[e.code] = true; if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function announce(text, color = '#ffb703') { banner = { text, timer: 150, color }; }
    function touch(p) { if (lastTouch !== p) { prevTouch = lastTouch; lastTouch = p; } }

    // Colisión círculo vs travesaño (cápsula). Evita atravesarlo y rebota arriba, abajo y por el borde.
    function barCollide(o, rest) {
        let hit = false;
        for (let s = 0; s < 2; s++) {
            const by = GROUND_Y - goalH[s];
            const cx = Math.max(s ? CW - GOAL_W : 0, Math.min(s ? CW : GOAL_W, o.x));
            let dx = o.x - cx, dy = o.y - by, d = Math.hypot(dx, dy);
            const min = o.radius + POST_RADIUS;
            if (d < min) {
                if (d === 0) { dx = 0; dy = -1; d = 1; }
                const nx = dx / d, ny = dy / d;
                o.x += nx * (min - d); o.y += ny * (min - d);
                const vn = o.vx * nx + o.vy * ny;
                if (vn < 0) { o.vx -= (1 + rest) * vn * nx; o.vy -= (1 + rest) * vn * ny; }
                if (o.grounded !== undefined && ny < -0.5) { o.grounded = true; if (o.vy > 0) o.vy = 0; }
                hit = true;
            }
        }
        return hit;
    }

    class PowerupBox {
        constructor() { this.size = 38; this.active = false; this.x = 0; this.y = 0; this.life = 0; this.type = 'superJump'; }
        spawn() {
            this.x = rnd(350, CW - 350); this.y = rnd(GROUND_Y - 300, GROUND_Y - 90);
            this.type = pick(Object.keys(PU_TYPES).filter(t => t !== lastBoxType)); lastBoxType = this.type;
            this.life = rnd(480, 840); this.active = true;
        }
        update() { if (--this.life <= 0) this.active = false; }
        draw() {
            const y = this.y + Math.sin(matchFrames * 0.08) * 6, s = this.size;
            ctx.fillStyle = '#ffb703'; ctx.fillRect(this.x - s / 2, y - s / 2, s, s);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(this.x - s / 2, y - s / 2, s, s);
            ctx.fillStyle = '#000'; ctx.font = '16px "Press Start 2P"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('?', this.x, y);
        }
    }

    class Player {
        constructor(x, isP1, data, isCPU) {
            this.startX = x; this.x = x; this.y = GROUND_Y - PLAYER_RADIUS; this.vx = 0; this.vy = 0;
            this.radius = PLAYER_RADIUS; this.isP1 = isP1; this.isCPU = isCPU; this.data = data;
            this.facing = isP1 ? 1 : -1; this.kickAnimTimer = 0; this.kickCooldown = 0; this.chargeTimer = 0;
            this.grounded = true; this.frozen = false; this.jumpForce = BASE_JUMP_FORCE; this.moveSpeed = MOVE_SPEED; this.cpuTarget = 12;
        }
        resetPos() {
            this.x = this.startX; this.y = GROUND_Y - this.radius; this.vx = this.vy = 0;
            this.kickAnimTimer = this.kickCooldown = this.chargeTimer = 0; this.facing = this.isP1 ? 1 : -1;
        }
        canReach() {
            const dx = ball.x - this.x, dy = ball.y - this.y;
            return Math.hypot(dx, dy) < this.radius + ball.radius + 38 && dx * this.facing > -12;
        }
        getInputs() {
            if (this.frozen) return { left: false, right: false, jump: false, kickHold: false };
            if (!this.isCPU) return this.isP1
                ? { left: keys.KeyA, right: keys.KeyD, jump: keys.KeyW, kickHold: keys.Space }
                : { left: keys.ArrowLeft, right: keys.ArrowRight, jump: keys.ArrowUp, kickHold: keys.KeyM };
            const i = { left: false, right: false, jump: false, kickHold: false };
            const atk = this.isP1 ? 1 : -1, dx = (ball.x - atk * 48) - this.x; // se ubica detrás de la pelota
            if (dx < -14) i.left = true; else if (dx > 14) i.right = true; else this.facing = atk;
            if (ball.y - this.y < -60 && Math.abs(ball.x - this.x) < 150) i.jump = true;
            if (this.facing === atk && this.canReach()) i.kickHold = this.chargeTimer < this.cpuTarget;
            return i;
        }
        update() {
            const inp = this.getInputs(); let mv = false;
            if (!this.frozen) {
                if (inp.left) { this.vx -= 1.5; this.facing = -1; mv = true; }
                if (inp.right) { this.vx += 1.5; this.facing = 1; mv = true; }
                this.vx = Math.max(-this.moveSpeed, Math.min(this.moveSpeed, this.vx));
                if (inp.jump && this.grounded) { this.vy = -this.jumpForce; this.grounded = false; }
                if (inp.kickHold) { if (this.chargeTimer < MAX_CHARGE) this.chargeTimer++; }
                else if (this.chargeTimer > 0) {
                    this.executeKick(this.chargeTimer >= SUPER_CHARGE); this.chargeTimer = 0;
                    this.cpuTarget = Math.random() < 0.18 ? SUPER_CHARGE + 3 : pick([3, 8, 15, 30]);
                }
            } else this.chargeTimer = 0;
            if (!mv) this.vx *= FRICTION;
            this.vy += GRAVITY * gravityMul; this.x += this.vx; this.y += this.vy; this.grounded = false;
            if (this.y + this.radius >= GROUND_Y) { this.y = GROUND_Y - this.radius; this.vy = 0; this.grounded = true; }
            if (this.x - this.radius < 0) { this.x = this.radius; this.vx = 0; }
            if (this.x + this.radius > CW) { this.x = CW - this.radius; this.vx = 0; }
            if (this.y - this.radius < 0) { this.y = this.radius; this.vy = Math.max(0, this.vy); }
            barCollide(this, 0);
            if (this.kickCooldown > 0) this.kickCooldown--;
            if (this.kickAnimTimer > 0) this.kickAnimTimer--;
        }
        executeKick(sup) {
            this.kickAnimTimer = 15;
            if (this.kickCooldown > 0 || !this.canReach()) return;
            this.kickCooldown = 22;
            let ang = 0.45 + Math.max(-0.2, Math.min(0.35, -(ball.y - this.y) / 160)), spd = 23, v = null;
            if (sup) { v = pick(SUPERS); ang = v.ang; spd = v.spd; announce(`¡SÚPER TIRO ${v.name} ${de(this.data.nickname)}!`, v.col); }
            ball.vx = this.facing * Math.cos(ang) * spd + this.vx * 0.3;
            ball.vy = -Math.sin(ang) * spd + this.vy * 0.2;
            ball.superType = v; ball.curveDir = Math.random() < 0.5 ? -1 : 1; ball.viaBar = false;
            touch(this);
        }
        draw() {
            let r = this.radius;
            
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x - r + 2, this.y - r - 2, r*2 - 4, r*2 + 4);
            ctx.fillRect(this.x - r - 2, this.y - r + 2, r*2 + 4, r*2 - 4);

            ctx.fillStyle = this.frozen ? '#90e0ef' : (this.data.skinColor || '#fcd5ce');
            ctx.fillRect(this.x - r + 4, this.y - r, r*2 - 8, r*2);
            ctx.fillRect(this.x - r, this.y - r + 4, r*2, r*2 - 8);

            // Camiseta con franja o diseño distintivo
            ctx.fillStyle = this.data.color;
            ctx.fillRect(this.x - r + 6, this.y + 2, r*2 - 12, r*0.9);
            ctx.fillStyle = this.data.stripeColor || '#ffffff';
            ctx.fillRect(this.x - 6, this.y + 2, 12, r*0.9);

            ctx.fillStyle = this.data.hairColor || '#000';
            let style = this.data.style;
            
            if (style === 'curly') {
                ctx.fillRect(this.x - r + 2, this.y - r, r*2 - 4, r*0.8);
                ctx.fillRect(this.x - r - 4, this.y - r + 4, 8, 12);
                ctx.fillRect(this.x + r - 4, this.y - r + 4, 8, 12);
            } else if (style === 'spiky') {
                ctx.fillRect(this.x - r + 4, this.y - r, r*2 - 8, r*0.6);
                ctx.fillRect(this.x - 10, this.y - r - 8, 8, 12);
                ctx.fillRect(this.x + 2, this.y - r - 10, 8, 14);
            } else if (style === 'beard') {
                ctx.fillRect(this.x - r + 4, this.y - r, r*2 - 8, r*0.5);
                ctx.fillRect(this.x - r + 6, this.y + 4, r*2 - 12, r*0.6);
            } else if (style === 'cap') {
                ctx.fillRect(this.x - r + 2, this.y - r, r*2 - 4, r*0.5);
                ctx.fillRect(this.x + (this.facing === 1 ? 0 : -r), this.y - r + 2, r*0.8, 6);
            } else if (style === 'visor') {
                ctx.fillRect(this.x - r + 4, this.y - r, r*2 - 8, r*0.6);
                ctx.fillStyle = '#00f5d4';
                ctx.fillRect(this.x - r + 6, this.y - 8, r*2 - 12, 6);
                ctx.fillRect(this.x + (this.facing * 12), this.y - r - 8, 3, 10);
            } else if (style === 'flower') {
                ctx.fillRect(this.x - r + 4, this.y - r, r*2 - 8, r*0.6);
                ctx.fillStyle = '#ff007f';
                ctx.fillRect(this.x + 8, this.y - r - 6, 10, 10);
            } else if (style === 'mate') {
                ctx.fillRect(this.x - r + 4, this.y - r, r*2 - 8, r*0.6);
                ctx.fillStyle = '#7f5539';
                let mateX = this.x + (this.facing === 1 ? r - 4 : -r - 12);
                ctx.fillRect(mateX, this.y + 8, 12, 14);
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(mateX + 4, this.y + 2, 2, 8);
            } else {
                ctx.fillRect(this.x - r + 4, this.y - r, r*2 - 8, r*0.6);
                ctx.fillRect(this.x - r, this.y - r + 4, r*2, r*0.4);
            }

            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x + (8 * this.facing), this.y - 8, 10, 10);
            ctx.fillRect(this.x + (24 * this.facing), this.y - 8, 10, 10);
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x + (12 * this.facing), this.y - 4, 4, 4);
            ctx.fillRect(this.x + (28 * this.facing), this.y - 4, 4, 4);
            ctx.fillRect(this.x + (14 * this.facing), this.y + 12, 12, 4);

            let footOffsetX = 5 * this.facing;
            let footOffsetY = r + 5;
            if (this.kickAnimTimer > 0) {
                footOffsetX = 35 * this.facing;
                footOffsetY = r - 10;
            }
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x + footOffsetX - FOOT_SIZE - 2, this.y + footOffsetY - FOOT_SIZE/2 - 2, FOOT_SIZE*2 + 4, FOOT_SIZE + 4);
            ctx.fillStyle = this.data.color;
            ctx.fillRect(this.x + footOffsetX - FOOT_SIZE, this.y + footOffsetY - FOOT_SIZE/2, FOOT_SIZE*2, FOOT_SIZE);

            if (this.chargeTimer > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(this.x - 35, this.y - r - 24, 70, 9);
                ctx.fillStyle = this.chargeTimer >= SUPER_CHARGE ? '#ff006e' : '#ffb703';
                ctx.fillRect(this.x - 33, this.y - r - 22, (66 * (this.chargeTimer / MAX_CHARGE)), 5);
            }
        }
    }

    class Ball {
        constructor() { this.radius = BALL_RADIUS; this.angle = 0; this.curveDir = 1; this.resetPos(); }
        resetPos() { this.x = CW / 2; this.y = GROUND_Y - 260; this.vx = this.vy = 0; this.superType = null; this.viaBar = false; }
        setRadius(r) { this.radius = r; if (this.y + r > GROUND_Y) this.y = GROUND_Y - r; }
        update() {
            let sp = Math.hypot(this.vx, this.vy);
            if (sp > MAX_BALL_SPEED) { this.vx *= MAX_BALL_SPEED / sp; this.vy *= MAX_BALL_SPEED / sp; sp = MAX_BALL_SPEED; }
            this.vy += GRAVITY * gravityMul;
            if (this.superType && this.superType.curve) this.vy += Math.sin(matchFrames * 0.25) * 0.9 * this.curveDir;
            const n = Math.max(1, Math.ceil(sp / 12)); // subpasos: la pelota rápida no atraviesa nada
            for (let i = 0; i < n; i++) {
                this.x += this.vx / n; this.y += this.vy / n;
                this.collide();
                hitPlayer(player1, this); hitPlayer(player2, this);
            }
            this.vx *= 0.9985; this.vy *= 0.9985;
            if (this.y + this.radius >= GROUND_Y - 0.5) this.vx *= 0.99;
            this.angle += this.vx / this.radius * 0.5;
        }
        collide() {
            const r = this.radius;
            if (this.y + r > GROUND_Y) {
                this.y = GROUND_Y - r;
                if (this.vy > 2.5) { this.vy *= -BALL_BOUNCE; this.superType = null; } else this.vy = 0;
            }
            if (this.y - r < 0) { this.y = r; this.vy *= -BALL_BOUNCE; }
            const left = this.x - r < 0, right = this.x + r > CW;
            if (left || right) { // el fondo de la red amortigua; el resto de la pared rebota normal
                const s = left ? 0 : 1, e = this.y > GROUND_Y - goalH[s] ? 0.2 : BALL_BOUNCE;
                this.x = left ? r : CW - r; this.vx *= -e;
            }
            if (barCollide(this, 0.72)) {
                this.viaBar = true;
                if (barCooldown <= 0 && Math.hypot(this.vx, this.vy) > 9) {
                    barCooldown = 90;
                    announce(lastTouch ? `¡AL TRAVESAÑO! CASI GOL ${de(lastTouch.data.nickname)}` : '¡AL TRAVESAÑO!', '#ffd166');
                }
            }
        }
        draw() {
            const r = this.radius, st = this.superType;
            ctx.save(); ctx.translate(this.x, this.y);
            if (st) {
                ctx.fillStyle = st.col + '66';
                ctx.beginPath(); ctx.arc(-this.vx * 0.6, -this.vy * 0.6, r * 1.2, 0, 7); ctx.fill();
                ctx.beginPath(); ctx.arc(-this.vx * 0.3, -this.vy * 0.3, r * 1.1, 0, 7); ctx.fill();
            }
            ctx.rotate(this.angle);
            ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fillStyle = st ? st.col : '#fff'; ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.stroke();
            ctx.fillStyle = st ? '#ffb703' : '#000';
            ctx.beginPath(); ctx.arc(0, 0, r * 0.38, 0, 7); ctx.fill();
            for (let k = 0; k < 5; k++) { const a = k * 1.2566; ctx.beginPath(); ctx.arc(Math.cos(a) * r * 0.8, Math.sin(a) * r * 0.8, r * 0.16, 0, 7); ctx.fill(); }
            ctx.restore();
        }
    }

    const powerupBox = new PowerupBox();

    // Choque elástico: el jugador es mucho más pesado que la pelota
    function hitPlayer(p, b) {
        const dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy), min = p.radius + b.radius;
        if (d >= min || d === 0) return;
        const nx = dx / d, ny = dy / d;
        b.x += nx * (min - d); b.y += ny * (min - d);
        const rel = (b.vx - p.vx) * nx + (b.vy - p.vy) * ny;
        if (rel < 0) { const j = -1.7 * rel * 0.857; b.vx += j * nx; b.vy += j * ny; }
        b.superType = null; b.viaBar = false; touch(p);
    }
    function pushPlayers(a, b) {
        const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.radius + b.radius;
        if (d >= min || d === 0) return;
        const nx = dx / d, ny = dy / d, o = (min - d) / 2;
        a.x -= nx * o; a.y -= ny * o; b.x += nx * o; b.y += ny * o;
        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel < 0) { const j = -1.1 * rel / 2; b.vx += j * nx; b.vy += j * ny; a.vx -= j * nx; a.vy -= j * ny; }
        if (ny > 0.6) a.grounded = true; else if (ny < -0.6) b.grounded = true;
    }

    function endPowerup() {
        player1.jumpForce = player2.jumpForce = BASE_JUMP_FORCE;
        player1.moveSpeed = player2.moveSpeed = MOVE_SPEED;
        player1.frozen = player2.frozen = false;
        ball.setRadius(BALL_RADIUS); gravityMul = 1; goalTarget = [GOAL_H, GOAL_H]; activePowerup = null;
    }
    function triggerPowerup(p, type) {
        endPowerup();
        const q = p === player1 ? player2 : player1, A = p.data.nickname, B = q.data.nickname;
        const dur = Math.round(PU_TYPES[type][1] * rnd(0.75, 1.3));
        if (type === 'superJump') { p.jumpForce = BASE_JUMP_FORCE * 1.5; announce(`¡${A} AGARRÓ SALTO LOCO!`, '#06d6a0'); }
        else if (type === 'freeze') { q.frozen = true; announce(`¡${A} CONGELÓ ${al(B)}!`, '#90e0ef'); }
        else if (type === 'giantGoal') { goalTarget[q === player1 ? 0 : 1] = GOAL_H * 1.5; announce(`¡${A} AGRANDÓ EL ARCO ${de(B)}!`, '#ffd166'); }
        else if (type === 'speedBoost') { p.moveSpeed = MOVE_SPEED * 1.6; announce(`¡${A} ACTIVÓ EL TURBO!`, '#ef476f'); }
        else if (type === 'bigBall') { ball.setRadius(BALL_RADIUS * 1.5); announce(`¡PELOTÓN! LA PELOTA CRECIÓ POR ${A}`, '#ffffff'); }
        else { gravityMul = 0.5; announce(`¡GRAVEDAD LUNAR POR CULPA ${de(A)}!`, '#b8c0ff'); }
        activePowerup = { type, timer: dur };
    }

    // ---------- Reglas y carteles ----------
    function checkGoal() {
        const r = ball.radius; // solo es gol si la pelota ENTERA cruzó la línea y va por debajo del travesaño
        if (ball.y > GROUND_Y - goalH[0] && ball.x + r < GOAL_W) registerGoal(0);
        else if (ball.y > GROUND_Y - goalH[1] && ball.x - r > CW - GOAL_W) registerGoal(1);
    }
    function makePhrase(o) {
        const A = o.att.data.nickname, B = o.def.data.nickname, f = o.f, a = o.a;
        if (o.own) return pick([[`¡GOL EN CONTRA ${de(B)}!`, `${A} lo agradece`], [`¡${B} LA METIÓ EN SU PROPIO ARCO!`, `Regalito para ${A}`], [`¡AUTOGOL ${de(B)}!`, `${A} suma sin tocarla`]]);
        if (suddenDeath) return [`¡GOL DE ORO ${de(A)}!`, `${B} se queda sin tiempo extra`];
        if (o.end) return [`¡${A} CERRÓ EL PARTIDO!`, `${B} no tiene respuesta`];
        if (o.sup) return [`¡SUPERGOLAZO ${de(A)}!`, `Un misil que ${B} ni vio pasar`];
        if (o.bar) return [`¡${A} LA METIÓ DESPUÉS DEL TRAVESAÑO!`, `${B} no lo puede creer`];
        if (timeRemaining <= 15) return [`¡GOL SOBRE LA HORA ${de(A)}!`, `${B} lo sufre en el final`];
        if (f === a) return [`¡${A} IGUALÓ EL PARTIDO!`, `${f} a ${a}, todo abierto`];
        if (f === 1 && a === 0) return [`¡${A} ABRIÓ EL MARCADOR!`, `${B} ya va perdiendo`];
        if (f - a >= 3) return [`¡${A} ESTÁ DESTROZANDO ${al(B)}!`, `Paliza en marcha: ${f} a ${a}`];
        if (f === a + 1 && a > 0) return [`¡${A} SE PUSO ADELANTE!`, `${B} tiene que reaccionar`];
        if (a > f) return [`¡DESCUENTO ${de(A)}!`, `Todavía hay partido: ${a} a ${f}`];
        return pick([[`¡GOLAZO ${de(A)}!`, `${B} no pudo hacer nada`], [`¡${A} LA MANDÓ A LA RED!`, `Gol para ${A}`], [`¡GOOOL ${de(A)}!`, `${B} se lamenta`]]);
    }
    function registerGoal(c) { // c = índice del arco donde entró (0 = arco de J1)
        if (gameState !== 'PLAYING') return;
        const att = c === 0 ? player2 : player1, def = c === 0 ? player1 : player2;
        if (c === 0) p2Score++; else p1Score++;
        const f = att === player1 ? p1Score : p2Score, a = att === player1 ? p2Score : p1Score;
        const own = lastTouch === def;
        goalInfo = makePhrase({ att, def, own, f, a, sup: !!ball.superType, bar: ball.viaBar, end: f >= MAX_GOALS });
        pendingEnd = suddenDeath || p1Score >= MAX_GOALS || p2Score >= MAX_GOALS;
        gameState = 'GOAL_PAUSE'; pauseFrames = 170; banner.timer = 0; spawnConfetti(); updateScoreUI();
    }
    function afterGoal() {
        if (pendingEnd) { showGameOver(); return; }
        player1.resetPos(); player2.resetPos(); ball.resetPos(); endPowerup();
        powerupBox.active = false; boxTimer = rnd(500, 1000); lastTouch = prevTouch = null; barCooldown = 0;
        gameState = 'PLAYING';
    }

    function step() {
        matchFrames++;
        if (barCooldown > 0) barCooldown--;
        if (banner.timer > 0) banner.timer--;
        for (let s = 0; s < 2; s++) goalH[s] += (goalTarget[s] - goalH[s]) * 0.08;
        if (gameState === 'GOAL_PAUSE') {
            ball.update();
            confetti.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.rot += p.rs; });
            if (--pauseFrames <= 0) afterGoal();
            return;
        }
        if (gameState !== 'PLAYING') return;
        if (!suddenDeath && ++tickFrames >= 60) {
            tickFrames = 0; timeRemaining--;
            if (timeRemaining <= 0) {
                if (p1Score === p2Score) { suddenDeath = true; announce('¡TIEMPO EXTRA! GOL DE ORO', '#ffd700'); }
                else { showGameOver(); return; }
            }
            updateScoreUI();
        }
        player1.update(); player2.update(); pushPlayers(player1, player2); ball.update();
        if (powerupBox.active) {
            powerupBox.update();
            let who = null;
            for (const p of [player1, player2]) if (Math.hypot(p.x - powerupBox.x, p.y - powerupBox.y) < p.radius + powerupBox.size / 2) who = p;
            if (!who && lastTouch && Math.hypot(ball.x - powerupBox.x, ball.y - powerupBox.y) < ball.radius + powerupBox.size / 2) who = lastTouch;
            if (who) { powerupBox.active = false; triggerPowerup(who, powerupBox.type); }
        } else if (!activePowerup && --boxTimer <= 0) { powerupBox.spawn(); }
        if (activePowerup && --activePowerup.timer <= 0) { endPowerup(); boxTimer = rnd(420, 1000); }
        checkGoal();
    }

    // ---------- Dibujo ----------
    function drawField(t) {
        const stripH = CH - GROUND_Y, mid = GROUND_Y + stripH / 2;
        ctx.fillStyle = '#0b132b'; ctx.fillRect(0, 0, CW, GROUND_Y);
        ctx.fillStyle = '#111827'; ctx.fillRect(0, 150, CW, GROUND_Y - 150);
        for (let i = 150; i < GROUND_Y; i += 30) { ctx.fillStyle = (i % 60 === 0) ? '#1f2937' : '#374151'; ctx.fillRect(0, i, CW, 15); }
        const jm = gameState === 'GOAL_PAUSE' ? 22 : 12;
        crowd.forEach(h => {
            const j = Math.abs(Math.sin(t * h.jumpSpeed)) * jm;
            ctx.fillStyle = h.color; ctx.fillRect(h.x, h.y - j, h.size, h.size * 1.5);
            ctx.fillStyle = '#fcd5ce'; ctx.fillRect(h.x + h.size * 0.1, h.y - j - h.size * 0.8, h.size * 0.8, h.size * 0.8);
        });
        ctx.fillStyle = '#48cae4'; ctx.fillRect(0, GROUND_Y - 20, CW, 20);
        for (let i = 0; i < CW; i += 50) for (let j = GROUND_Y; j < CH; j += 20) { ctx.fillStyle = ((i / 50 + j / 20) % 2 === 0) ? '#2b9348' : '#007f5f'; ctx.fillRect(i, j, 50, 20); }
        ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 4;
        ctx.fillRect(0, GROUND_Y, CW, 6); ctx.fillRect(CW / 2 - 3, GROUND_Y, 6, stripH);
        ctx.beginPath(); ctx.ellipse(CW / 2, mid, 90, stripH / 2 - 6, 0, 0, 7); ctx.stroke();
        for (let s = 0; s < 2; s++) {
            const gx = s ? CW - GOAL_W : GOAL_W, ax = s ? gx - 230 : gx + 230;
            ctx.fillRect(gx - 2, GROUND_Y, 4, stripH);                                   // línea de gol
            ctx.strokeRect(Math.min(gx, ax), GROUND_Y + 8, 230, stripH - 16);            // área grande
            ctx.beginPath(); ctx.arc(s ? gx - 130 : gx + 130, mid, 5, 0, 7); ctx.fill(); // punto penal
        }
    }
    function drawGoals() {
        for (let s = 0; s < 2; s++) {
            const h = goalH[s], x0 = s ? CW - GOAL_W : 0, top = GROUND_Y - h;
            ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(x0, top, GOAL_W, h);
            ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath();
            for (let i = 0; i <= GOAL_W; i += 15) { ctx.moveTo(x0 + i, top); ctx.lineTo(x0 + i, GROUND_Y); }
            for (let j = 0; j <= h; j += 15) { ctx.moveTo(x0, top + j); ctx.lineTo(x0 + GOAL_W, top + j); }
            ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.fillRect(x0, top - POST_RADIUS, GOAL_W, POST_RADIUS * 2);
            ctx.beginPath(); ctx.arc(s ? x0 : x0 + GOAL_W, top, POST_RADIUS, 0, 7); ctx.fill();
            ctx.fillRect(s ? CW - 8 : 0, top, 8, h);
        }
    }
    function fit(txt, px, maxW, bold) {
        ctx.font = `${px}px "Press Start 2P"`;
        while (ctx.measureText(txt).width > maxW && px > 12) { px -= 2; ctx.font = `${px}px "Press Start 2P"`; }
    }
    function render(t) {
        drawField(t); drawGoals();
        if (powerupBox.active) powerupBox.draw();
        player1.draw(); player2.draw(); ball.draw();
        ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
        if (activePowerup) {
            ctx.fillStyle = '#fff'; ctx.font = '14px "Press Start 2P"';
            ctx.fillText(`${PU_TYPES[activePowerup.type][0]}  ${Math.ceil(activePowerup.timer / 60)}s`, CW / 2, 110);
        }
        if (banner.timer > 0 && gameState === 'PLAYING') {
            ctx.save(); ctx.globalAlpha = Math.min(1, banner.timer / 30);
            fit(banner.text, 22, CW - 200); ctx.shadowColor = '#000'; ctx.shadowBlur = 8; ctx.fillStyle = banner.color;
            ctx.fillText(banner.text, CW / 2, 160); ctx.restore();
        }
        if (gameState === 'GOAL_PAUSE') {
            ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, CW, CH);
            confetti.forEach(p => { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot * Math.PI / 180); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6); ctx.restore(); });
            ctx.save(); ctx.shadowColor = '#ff006e'; ctx.shadowBlur = 25; ctx.fillStyle = '#ff006e';
            fit(goalInfo[0], 38, CW - 160); ctx.fillText(goalInfo[0], CW / 2, CH / 2 - 10);
            ctx.fillStyle = '#ffb703'; fit(goalInfo[1], 20, CW - 160); ctx.fillText(goalInfo[1], CW / 2, CH / 2 + 40);
            ctx.restore();
        }
    }
    let lastT = 0, acc = 0;
    function frame(t) {
        requestAnimationFrame(frame);
        const dt = Math.min(t - lastT, 100); lastT = t;
        if (gameState === 'MENU' || gameState === 'SELECT' || gameState === 'GAMEOVER') return;
        acc += dt; while (acc >= STEP) { acc -= STEP; step(); }
        render(t);
    }

    function initRosterUI() {
        const grid = document.getElementById('char-grid');
        grid.innerHTML = '';
        ROSTER.forEach(char => {
            const div = document.createElement('div');
            div.className = 'char-card text-white font-bold';
            div.innerHTML = `
                <div class="char-color-preview" style="background-color: ${char.color}; border-color: ${char.hairColor};">
                   <span style="font-size: 16px;">${char.badge}</span>
                </div>
                <div class="char-name">${char.name}</div>
            `;
            div.onclick = () => selectChar(char);
            grid.appendChild(div);
        });
    }

    function goToMenu() {
        gameState = 'MENU';
        uiMenu.classList.remove('hidden');
        uiSelect.classList.add('hidden');
        uiGameover.classList.add('hidden');
        uiHud.classList.add('hidden');
    }

    function startSelection(mode) {
        currentMode = mode;
        uiMenu.classList.add('hidden');
        uiSelect.classList.remove('hidden');
        selectingPlayer = 1;
        p1Choice = null;
        p2Choice = null;
        document.getElementById('select-title').textContent = "ELIGE JUGADOR 1";
        document.getElementById('select-title').className = "text-3xl text-cyan-400 mb-6 text-center";
        initRosterUI();
    }

    function selectChar(char) {
        if (selectingPlayer === 1) {
            p1Choice = char;
            if (currentMode === 'CPU') {
                let available = ROSTER.filter(c => c.id !== p1Choice.id);
                p2Choice = available[Math.floor(Math.random() * available.length)];
                initMatch();
            } else {
                selectingPlayer = 2;
                document.getElementById('select-title').textContent = "ELIGE JUGADOR 2";
                document.getElementById('select-title').className = "text-3xl text-pink-400 mb-6 text-center";
            }
        } else {
            p2Choice = char;
            initMatch();
        }
    }

    function initMatch() {
        uiSelect.classList.add('hidden'); uiHud.classList.remove('hidden');
        document.getElementById('p1-hud-name').textContent = p1Choice.name.toUpperCase();
        document.getElementById('p2-hud-name').textContent = p2Choice.name.toUpperCase() + (currentMode === 'CPU' ? ' (CPU)' : '');
        p1Score = p2Score = 0; timeRemaining = MATCH_DURATION; tickFrames = 0; suddenDeath = false; pendingEnd = false;
        goalH = [GOAL_H, GOAL_H]; goalTarget = [GOAL_H, GOAL_H]; gravityMul = 1; matchFrames = 0; barCooldown = 0;
        lastTouch = prevTouch = null; activePowerup = null; lastBoxType = ''; powerupBox.active = false; boxTimer = rnd(500, 1000); banner.timer = 0;
        player1 = new Player(CW / 4, true, p1Choice, false);
        player2 = new Player(CW * 3 / 4, false, p2Choice, currentMode === 'CPU');
        ball = new Ball(); updateScoreUI();
        gameState = 'PLAYING'; acc = 0; lastT = performance.now();
    }
    function updateScoreUI() {
        document.getElementById('p1-score').textContent = p1Score;
        document.getElementById('p2-score').textContent = p2Score;
        document.getElementById('timer-box').textContent = suddenDeath ? 'GOL DE ORO' : `${String(Math.floor(timeRemaining / 60)).padStart(2, '0')}:${String(timeRemaining % 60).padStart(2, '0')}`;
    }

    function showGameOver() {
        gameState = 'GAMEOVER';
        uiHud.classList.add('hidden');
        uiGameover.classList.remove('hidden');
        
        let wName = p1Score > p2Score ? p1Choice.name : p2Choice.name;
        if (p1Score === p2Score) wName = "EMPATE";
        
        document.getElementById('winner-text').textContent = wName === "EMPATE" ? "¡EMPATE!" : `¡CAMPEÓN: ${wName.toUpperCase()}!`;
        document.getElementById('final-score').textContent = `${p1Score} - ${p2Score}`;
    }

    goToMenu();
    requestAnimationFrame(frame);
</script>
</body>
</html>
